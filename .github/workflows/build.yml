name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        shell: pwsh
        run: |
          $sm = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          'y' | & $sm "platforms;android-34" "build-tools;34.0.0" | Out-Null
      - name: Debug keystore
        shell: pwsh
        run: |
          $ks = "$env:USERPROFILE\.android\debug.keystore"
          if (-not (Test-Path $ks)) {
            New-Item -ItemType Directory -Force (Split-Path $ks) | Out-Null
            keytool -genkeypair -keystore $ks -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          }
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MLBB-144Hz-Infinix
          path: MLBB-144Hz-Infinix.apk
